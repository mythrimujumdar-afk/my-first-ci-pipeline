
name: Manual Approval Pipeline

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type yes to approve deployment'
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -v

  production:
    needs: build-and-test
    if: ${{ inputs.approval == 'yes' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deployment approved
        run: echo "Manual approval received. Deployment started!"
