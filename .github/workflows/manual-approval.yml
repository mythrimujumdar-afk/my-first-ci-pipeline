
name: Manual Approval Pipeline

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type yes to approve production deployment'
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -v

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        run: echo "Deploying to Staging..."

  production:
    needs: deploy-staging
    if: ${{ inputs.approval == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production
        run: echo "Approval received. Deploying to Production..."
